services:
  app:
    build: .
    container_name: bildyapp-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_URI:
      JWT_SECRET: 
      CLOUDINARY_CLOUD_NAME: 
      CLOUDINARY_API_KEY: 
      CLOUDINARY_API_SECRET: 
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: bildyapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: